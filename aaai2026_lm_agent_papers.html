function renderPapers(filter='all'){
  const grid=document.getElementById('paperGrid');
  grid.innerHTML='';
  let count=0;
  papers.forEach((p,i)=>{
    if(filter!=='all'&&!p.cats.includes(filter))return;
    count++;
    const catLabels={arch:'Agent架构',multi:'Multi-Agent',gui:'GUI Agent',tool:'工具使用',safety:'Agent安全',reason:'Agent推理',search:'搜索Agent',memory:'Agent记忆'};
    const tags=p.cats.map(c=>`<span class="tag tag-${c}">${catLabels[c]}</span>`).join('');
    const fig1Html=p.fig1?`<img src="${p.fig1}" alt="Figure 1" onclick="openLB(this.src)" onerror="this.outerHTML='<div class=\\'fig-placeholder\\'>图片暂不可用</div>'">`:`<div class="fig-placeholder">📄 参见论文原文</div>`;
    const fig2Html=p.fig2?`<img src="${p.fig2}" alt="Figure 2" onclick="openLB(this.src)" onerror="this.outerHTML='<div class=\\'fig-placeholder\\'>图片暂不可用</div>'">`:`<div class="fig-placeholder">📄 参见论文原文</div>`;
    grid.innerHTML+=`
    <div class="card">
      <div class="card-body">
        <div class="card-title"><a href="${p.arxiv}" target="_blank">${p.title}</a></div>
        <div class="card-authors">${p.authors}</div>
        <div class="card-tags">${tags}</div>
        <div class="card-summary">${p.summary}</div>
        <div class="figures">
          <div class="fig-item">${fig1Html}<div class="fig-label">Motivation: ${p.fig1cap}</div></div>
          <div class="fig-item">${fig2Html}<div class="fig-label">Overview: ${p.fig2cap}</div></div>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('count-all').textContent=papers.length;
}

function openLB(src){
  document.getElementById('lb-img').src=src;
  document.getElementById('lightbox').classList.add('show');
}

function toggleTheme(){
  const d=document.documentElement;
  d.setAttribute('data-theme',d.getAttribute('data-theme')==='dark'?'light':'dark');
}

document.getElementById('filterBar').addEventListener('click',e=>{
  if(!e.target.classList.contains('filter-btn'))return;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  renderPapers(e.target.dataset.cat);
});

renderPapers();
</script>
